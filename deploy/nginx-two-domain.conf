# Original-architecture nginx config: front-end on bullrunn.fun, API on
# api.bullrunn.fun — matching how the live site was set up (nginx + Express).
# Use this instead of the single-origin setup if you want the exact two-domain
# layout. Put the static front-end (repo root) at /var/www/bullrun and run the
# backend (systemd unit in this folder) on 127.0.0.1:8787.
#
# TLS: run `certbot --nginx -d bullrunn.fun -d www.bullrunn.fun -d api.bullrunn.fun`
# after this is in place; certbot rewrites these blocks to listen on 443.

# --- front-end: bullrunn.fun ------------------------------------------------
server {
    listen 80;
    server_name bullrunn.fun www.bullrunn.fun;

    root /var/www/bullrun;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback
    }
}

# --- API: api.bullrunn.fun --------------------------------------------------
server {
    listen 80;
    server_name api.bullrunn.fun;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
