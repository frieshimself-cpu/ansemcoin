# Single-origin front-end + API for the Bull Run site.
#
# Serves the static front-end and reverse-proxies /api to the backend on the
# SAME domain, so you only need one domain and one TLS certificate. The
# front-end's hard-coded `https://api.bullrunn.fun` base is rewritten on the fly
# to same-origin `/api` via sub_filter — the files on disk are never changed.
#
# (If you'd rather reproduce the original two-domain setup — bullrunn.fun +
#  api.bullrunn.fun — use deploy/nginx-two-domain.conf instead.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rewrite the API base to same-origin so /api hits the backend on this host.
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter 'https://api.bullrunn.fun' '';

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> backend container. proxy_pass without a path keeps the /api prefix,
    # which is where the Express app mounts its routes.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
