<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bull.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/lightbg.jpeg" />
    <link rel="preload" as="image" href="/lighttext.png" />
    <title>Bull Run</title>
    <script type="module" crossorigin src="/assets/index-e2y_TuZg.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DWdqRevs.css">
  </head>
  <body>
    <div id="root"></div>
    <style>
      #ca-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:42px;z-index:90;display:none;flex-direction:column;align-items:center;gap:7px;max-width:94vw}
      #ca-bar.show{display:flex}
      #ca-pill{display:flex;align-items:center;gap:10px;background:rgba(18,11,3,.85);border:2px solid #d4a446;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,120,.25);font-family:Fredoka,'Trebuchet MS',sans-serif}
      #ca-pill:hover{border-color:#ffd23f}
      #ca-pill .ca-label{color:#ffb020;font-weight:700;font-size:14px;letter-spacing:1px}
      #ca-pill .ca-addr{color:#f5f2ea;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;text-align:left}
      #ca-pill .ca-copy{color:#c9a86a;font-size:12px;white-space:nowrap}
      #ca-pump{color:#2fe07a;font-family:Fredoka,'Trebuchet MS',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.8)}
      #ca-pump:hover{text-decoration:underline;color:#35e57f}
      @media (max-width:640px){#ca-bar{bottom:34px}#ca-pill{padding:8px 12px}#ca-pill .ca-addr{font-size:11px}}
      /* landing keeps only the CA + pump.fun link — hide the social dock */
      .dock{display:none !important}
    </style>
    <div id="ca-bar">
      <button id="ca-pill" type="button" title="Copy contract address">
        <span class="ca-label">CA</span>
        <span class="ca-addr">EF1zuHi6qcycATbPCrdscCf35zBfZ9SzuFRyjuPXpump</span>
        <span class="ca-copy">copy</span>
      </button>
      <a id="ca-pump" href="https://pump.fun/coin/EF1zuHi6qcycATbPCrdscCf35zBfZ9SzuFRyjuPXpump" target="_blank" rel="noopener">pump.fun</a>
    </div>
    <script>
      (function () {
        var CA = 'EF1zuHi6qcycATbPCrdscCf35zBfZ9SzuFRyjuPXpump';
        var bar = document.getElementById('ca-bar');
        var pill = document.getElementById('ca-pill');
        var hint = pill.querySelector('.ca-copy');
        pill.addEventListener('click', function () {
          function done() {
            hint.textContent = 'copied!';
            setTimeout(function () { hint.textContent = 'copy'; }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(CA).then(done, done);
          } else {
            var t = document.createElement('textarea');
            t.value = CA; document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(t); done();
          }
        });
        // Only show on the landing screen (hidden during loading, gameplay, docs)
        setInterval(function () {
          bar.classList.toggle('show', !!document.querySelector('.landing'));
        }, 400);
      })();
    </script>
  </body>
</html>
