name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: server
        run: npm ci
      - name: Run smoke test
        working-directory: server
        run: npm test

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t bullrun-api ./server
      - name: Build web image
        run: docker build -t bullrun-web -f Dockerfile.web .
      - name: Smoke-test the stack
        run: |
          JWT_SECRET=ci-test docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then ok=1; break; fi
            sleep 2
          done
          echo
          curl -fsS http://localhost/api/leaderboard | head -c 120; echo
          curl -fsS -o /dev/null -w "index.html -> %{http_code}\n" http://localhost/
          docker compose down
          test -n "$ok"
