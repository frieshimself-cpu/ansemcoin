# Full Bull Run stack: reconstructed API + static front-end, one command.
#
#   ./deploy.sh          # generates a JWT secret and runs `docker compose up`
#   # or manually:
#   JWT_SECRET=... docker compose up -d --build
#
# Then open http://localhost (or your server's IP / domain). Everything —
# accounts, leaderboard, score submission — runs on this one origin.

services:
  api:
    build: ./server
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (run ./deploy.sh, or put it in .env)}
      PORT: "8787"
    volumes:
      - bullrun-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  bullrun-data:
